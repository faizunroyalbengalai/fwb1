name: Deploy fwb1 Python to EC2

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision EC2
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.get_ip.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/deploy_key.pub

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}"

      - name: Get server IP
        id: get_ip
        working-directory: terraform
        run: |
          IP=$(terraform output -raw instance_public_ip)
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

  configure:
    name: Configure EC2 with Ansible
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Wait for SSH
        run: |
          IP="${{ needs.provision.outputs.server_ip }}"
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/deploy_key ubuntu@$IP echo ok && break || sleep 10
          done

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          ansible-playbook -i "$SERVER_IP," \
            --private-key /tmp/deploy_key \
            -u ubuntu \
            ansible/playbook.yml \
            -e "project_name=${{ secrets.PROJECT_NAME }}" \
            -e "database_url='${{ secrets.DATABASE_URL }}'" \
            -e "mongo_uri='${{ secrets.MONGO_URI }}'" \
            -e "db_host='${{ secrets.DB_HOST }}'" \
            -e "db_port='${{ secrets.DB_PORT }}'" \
            -e "db_name='${{ secrets.DB_NAME }}'" \
            -e "db_user='${{ secrets.DB_USER }}'" \
            -e "db_user='${{ secrets.DB_USER }}'" \
            -e "db_username='${{ secrets.DB_USERNAME }}'" \
            -e "db_password='${{ secrets.DB_PASSWORD }}'" \
            -e "db_password_plain='${{ secrets.DB_PASSWORD }}'" \
            -e "install_db='${{ secrets.INSTALL_DB_ON_EC2 }}'" \
            -e "db_type='${{ secrets.DB_TYPE }}'"

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [provision, configure]
    steps:
      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Wait for app health
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          echo "Verifying app at http://$SERVER_IP/health"
          SUCCESS=false
          for i in $(seq 1 12); do
            STATUS=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key ubuntu@$SERVER_IP \
              "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            sleep 10
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "App did not become healthy. Fetching logs..."
            ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@$SERVER_IP \
              "sudo journalctl -u fwb1 --no-pager -n 50 || true"
            exit 1
          fi
          echo "msg: server_ip=$SERVER_IP"
          echo "Deployment verified successfully."

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [provision, verify]
    if: always()
    steps:
      - name: Deployment status
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          if [ "${{ needs.verify.result }}" = "success" ]; then
            echo "Deployment succeeded. App is live at http://$SERVER_IP"
          else
            echo "Deployment failed or verification did not pass."
            exit 1
          fi